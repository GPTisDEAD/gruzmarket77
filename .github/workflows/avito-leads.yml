# Бот лидов Авито → Telegram. Поллинг каждые ~5 минут.
# Секреты (Settings → Secrets → Actions): AVITO_CLIENT_ID, AVITO_CLIENT_SECRET,
# TG_BOT_TOKEN, TG_CHAT_IDS. Логи публичны — контент переписки в них не попадает.
name: avito-leads
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "avito-bot/**"
      - ".github/workflows/avito-leads.yml"

concurrency:
  group: avito-leads
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: avito-bot

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: avito-leads-state-${{ github.run_id }}
          restore-keys: avito-leads-state-

      - name: Poll Avito → Telegram
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
        run: |
          set +e
          python3 avito-bot/poll.py > avito-bot/last-run.log 2>&1
          echo "exit=$?" >> avito-bot/last-run.log
          cat avito-bot/last-run.log

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: avito-leads-state-${{ github.run_id }}

      - name: Commit diag report
        if: always()
        run: |
          git config user.name "gm77-bot"
          git config user.email "bot@gruzmarket77.ru"
          git add -f avito-bot/diag.log avito-bot/last-run.log || true
          git diff --cached --quiet || {
            git commit -m "bot diag [skip ci]"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 0; }
            git push origin HEAD:main || true
          }
