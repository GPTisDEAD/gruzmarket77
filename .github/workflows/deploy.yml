name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # ВРЕМЕННО, до подключения домена gruzmarket77.ru:
      # сайт живёт на ciriycpro.github.io/gruzmarket77/ — переписываем
      # корневые абсолютные ссылки под подпапку. При переходе на домен
      # этот шаг удаляется и возвращается public/CNAME.
      - name: Rewrite root-absolute URLs for project-pages preview
        run: |
          find dist \( -name '*.html' -o -name '*.xml' \) -print0 | xargs -0 sed -i \
            -e 's|href="/|href="/gruzmarket77/|g' \
            -e 's|src="/|src="/gruzmarket77/|g' \
            -e 's|href="/gruzmarket77/gruzmarket77/|href="/gruzmarket77/|g'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
