# Разовая утилита: показать chat_id всех, кто написал боту /start.
# Запуск руками: Actions → tg-setup → Run workflow. Печатает ТОЛЬКО числовые id.
name: tg-setup
on:
  workflow_dispatch:

permissions: {}

jobs:
  chat-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Get chat ids
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          tok = os.environ["TG_BOT_TOKEN"]
          with urllib.request.urlopen(
              f"https://api.telegram.org/bot{tok}/getUpdates", timeout=30) as r:
              ups = json.loads(r.read()).get("result", [])
          seen = {}
          for u in ups:
              m = u.get("message")
              if not m:
                  continue
              cid = str(m["chat"]["id"])
              name = (m["chat"].get("first_name") or "?")
              seen[cid] = name[:1] + "*" * max(len(name) - 1, 1)
          print("updates total:", len(ups))
          for cid, mask in seen.items():
              print(f"chat id: {cid}  name: {mask}")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{tok}/sendMessage",
                  data=json.dumps({"chat_id": cid,
                      "text": "✅ Тест: вы подключены к боту лидов GruzMarket77. Ответьте Артёму, что получили."}).encode(),
                  headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=30)
              print(f"test message sent to {cid}")
          if not seen:
              print("chat ids: никто ещё не написал боту /start")
          PY
