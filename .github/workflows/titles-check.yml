# Снимает реальные заголовки объявлений из кабинета Авито (API) → titles-report.txt
name: titles-check
on:
  push:
    paths:
      - "avito-bot/titles-ping"

permissions:
  contents: write

concurrency:
  group: titles-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: avito-bot

      - name: List titles via Avito API
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: python3 avito-bot/list_titles.py

      - name: Commit report
        if: always()
        run: |
          git config user.name "gm77-bot"
          git config user.email "bot@gruzmarket77.ru"
          git add -f avito-bot/titles-report.txt || true
          git diff --cached --quiet || {
            git commit -m "titles report [skip ci]"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 0; }
            git push origin HEAD:main || true
          }
